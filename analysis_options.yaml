# pedantic_mono（flutter_lints の上に追加ルール。strict-casts / strict-inference /
# strict-raw-types も有効）に、このアプリ向けの調整を足す。
include: package:pedantic_mono/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - ios/**
  # pedantic_mono でも有効だが、上流で外されても維持されるよう明示する。
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # `if (x) return;` のガード節まで改行させるルール。if 文の波括弧は
    # flutter_lints の curly_braces_in_flow_control_structures で揃える。
    always_put_control_body_on_new_line: false
    # Retro の色定数のような「static だけのクラス」は、Flutter の Colors / Icons と
    # 同じ名前空間の使い方なので許す。
    avoid_classes_with_only_static_members: false
