name: hinge_angle_game
description: >-
  Pitatto Angle: a party game for the foldable iPhone Duo. Remember the target
  angle, then bend the device to it with the screen dark.
publish_to: 'none'

# ビルド番号（+N）は tool/release_testflight.sh が上げる。
version: 1.1.0+15

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  device_angle:
    path: packages/device_angle
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  objective_c: ^9.6.4
  shared_preferences: ^2.5.6

dev_dependencies:
  cupertino_ui: ^1.1.6
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  pedantic_mono: ^1.39.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/sfx/
    - assets/fonts/OFL_DotGothic16.txt

  # ドットフォント（SIL OFL 1.1）。Regular のみなので weight/style は付けない（擬似太字でにじむ）。
  fonts:
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf
